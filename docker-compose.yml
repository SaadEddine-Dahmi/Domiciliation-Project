services:
  postgres:
    image: postgres:16-alpine
    container_name: pfe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: domiciliation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domiciliation"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pfe_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      LOG_CHANNEL: stderr
    volumes:
      - backend_storage:/var/www/html/storage

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pfe_backend_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - backend_storage:/var/www/html/storage:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: "http://localhost:8000"
    container_name: pfe_frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: "http://localhost:8000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_storage:
