services:
  postgres:
    image: postgres:16-alpine
    container_name: pfe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pfe_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN}
      FRONTEND_URL: https://${APP_DOMAIN}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    volumes:
      - backend_storage:/var/www/html/storage

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pfe_backend_nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend:/var/www/html:ro
      - backend_storage:/var/www/html/storage:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: https://${APP_DOMAIN}
    container_name: pfe_frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: https://${APP_DOMAIN}

  caddy:
    image: caddy:2-alpine
    container_name: pfe_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend-nginx
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:
